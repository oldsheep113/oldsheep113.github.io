{{ define "main" }}
    <div class="posts">
{{ range where .Site.RegularPages "Section" "in" (slice "post" "notes") }}
<article class="post">
  <h1 class="post-title">
    <a href="{{ .RelPermalink }}">{{ .Title }}</a>
  </h1>
  <time datetime="{{ .Date.Format "2006-01-02T15:04:05-0700" }}" class="post-date">{{ .Date.Format "2006年1月2日" }}</time>
  {{ .Summary }}
  {{ if .Truncated }}
  <div class="read-more-link">
    <a href="{{ .RelPermalink }}">Read More&hellip;</a>
  </div>
  {{ end }}
</article>{{ end }}
</div>
{{ end }}
