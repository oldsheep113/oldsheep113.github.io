{{ define "main" }}
<div class="post links-page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ with .Site.Data.links }}
  <ul class="link-list">
    {{ range . }}
    {{ $name := .name }}
    <li>
      <a class="link-card" href="{{ .url }}" target="_blank" rel="noopener noreferrer">
        <span class="link-avatar">
          {{ with .avatar }}
          <img src="{{ . | relURL }}" alt="" loading="lazy">
          {{ else }}
          <span class="link-avatar-fallback">友</span>
          {{ end }}
        </span>
        <span class="link-info">
          <span class="link-name">{{ $name }}</span>
          {{ with .description }}<span class="link-desc">{{ . }}</span>{{ end }}
        </span>
      </a>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p class="link-empty">友链整理中，欢迎来交换。</p>
  {{ end }}
</div>
{{ end }}
