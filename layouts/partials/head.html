  <link href="https://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">
  {{ hugo.Generator }}

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} &middot; {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Description }}{{ end }}" />

  <link type="text/css" rel="stylesheet" href="{{ "css/print.css" | relURL }}" media="print">
  <link type="text/css" rel="stylesheet" href="{{ "css/poole.css" | relURL }}">
  <link type="text/css" rel="stylesheet" href="{{ "css/syntax.css" | relURL }}">
  <link type="text/css" rel="stylesheet" href="{{ "css/hyde.css" | relURL }}">
  <link type="text/css" rel="stylesheet" href="{{ "css/custom.css" | relURL }}">

  <link rel="apple-touch-icon-precomposed" sizes="144x144" href="{{ "apple-touch-icon-144-precomposed.png" | relURL }}">
  <link rel="shortcut icon" href="{{ "favicon.png" | relURL }}">

  {{ with .OutputFormats.Get "RSS" }}
  <link href="{{ .RelPermalink }}" rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" />
  {{ end }}

  <link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}">
  <script defer src="{{ "katex/katex.min.js" | relURL }}"></script>
  <script defer src="{{ "katex/contrib/auto-render.min.js" | relURL }}"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      renderMathInElement(document.body, {
        delimiters: [
          {left: "$$", right: "$$", display: true},
          {left: "$", right: "$", display: false}
        ]
      });
    });
  </script>
